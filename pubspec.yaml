name: sih_voice_bridge
description: Offline speech-to-speech emergency communication bridge.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  google_fonts: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/stt/
    - assets/models/stt/en/
    - assets/models/tts/
    - assets/models/stt/hi/
